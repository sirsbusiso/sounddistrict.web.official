<section class="subscribe-section">
  <div class="subscribe-content">
    <span class="subscribe-label">
      <i class="bi bi-stars"></i>
      JOIN THE COMMUNITY
    </span>

    <h2>Be First to Hear What's Next</h2>

    <p>
      Get new podcast episodes, exclusive DJ mixes, early merchandise drops and
      special announcements delivered straight to your inbox.
    </p>

    <form class="subscribe-form" (ngSubmit)="subscribe()">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Your email address"
        required
      />

      <button type="submit">
        Join Now

        <span class="button-icon">
          <i class="bi bi-arrow-up-right"></i>
        </span>
      </button>
    </form>

    <small> Join thousands of house music lovers. Unsubscribe anytime. </small>
  </div>
</section>
