<section class="subscribe-section">
  <div class="subscribe-glow"></div>

  <div class="subscribe-content">
    <span class="subscribe-badge">
      <span class="live-dot"></span>
      JOIN THE COMMUNITY
    </span>

    <h2>
      Be First to Hear
      <span>What's Next.</span>
    </h2>

    <p>
      Get new podcast episodes, exclusive DJ mixes, unreleased music,
      merchandise drops and special announcements delivered straight to your
      inbox.
    </p>

    <form class="subscribe-form" (ngSubmit)="subscribe()">
      <div class="subscribe-input">
        <i class="bi bi-envelope"></i>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email address"
          required
        />
      </div>

      <button type="submit">
        Subscribe

        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="subscribe-features">
      <div class="feature">
        <i class="bi bi-broadcast"></i>
        <span>New Episodes</span>
      </div>

      <div class="feature">
        <i class="bi bi-vinyl"></i>
        <span>Exclusive Mixes</span>
      </div>

      <div class="feature">
        <i class="bi bi-bag"></i>
        <span>Merch Drops</span>
      </div>
    </div>

    <small> No spam. Unsubscribe anytime. </small>
  </div>
</section>
