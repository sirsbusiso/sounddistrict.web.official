<div class="player-shell" *ngIf="player.currentTrack$ | async as track">
  <div
    class="player"
    [class.expanded]="player.expanded$ | async"
    [class.playing]="player.isPlaying$ | async"
    [style.borderTop]="player.getPlayerBorder()"
    (click)="openPlayer()"
  >
    <!-- Top Progress Bar -->

    <div class="player-progress-top">
      <input
        class="player-slider"
        type="range"
        min="0"
        [max]="(player.duration$ | async) || 0"
        [value]="sliderValue"
        [style.--progress]="
          (sliderValue * 100) / ((player.duration$ | async) || 1) + '%'
        "
        (pointerdown)="dragging = true"
        (pointerup)="onSeek()"
        (input)="sliderValue = +$any($event.target).value"
        (click)="$event.stopPropagation()"
      />
    </div>

    <div class="player-content">
      <!-- Controls -->

      <div class="player-controls">
        <button
          class="control-button"
          *ngIf="player.expanded$ | async"
          (click)="player.skipBackward(15); $event.stopPropagation()"
        >
          <i class="bi bi-arrow-counterclockwise"></i>
          <small>15</small>
        </button>

        <button
          class="play-button"
          (click)="
            $event.preventDefault();
            $event.stopPropagation();
            player.toggle(track)
          "
        >
          <i
            class="bi"
            [ngClass]="
              (player.isPlaying$ | async) ? 'bi-pause-fill' : 'bi-play-fill'
            "
          ></i>
        </button>

        <button
          class="control-button"
          *ngIf="player.expanded$ | async"
          (click)="player.skipForward(30); $event.stopPropagation()"
        >
          <i class="bi bi-arrow-clockwise"></i>
          <small>30</small>
        </button>
      </div>

      <!-- Artwork -->

      <div class="player-artwork">
        <img [src]="track.artworkUrl" [alt]="track.title" />
      </div>

      <!-- Title -->

      <div class="player-title-wrapper">
        <h4
          class="player-title"
          (click)="openEpisode(track.slug); $event.stopPropagation()"
        >
          {{ track.title }}
        </h4>
      </div>

      <!-- Stats -->

      <div class="player-stats">
        <span class="player-stat" *ngIf="track.plays">
          <i class="bi bi-play-fill"></i>
          {{ track.plays | number }}
        </span>

        <span class="player-stat" *ngIf="track.downloads && !isMusic">
          <i class="bi bi-download"></i>
          {{ track.downloads | number }}
        </span>
      </div>
      <!-- Actions -->

      <div class="player-actions">
        <button
          class="icon-button"
          title="Download"
          *ngIf="!isMusic"
          (click)="
            $event.preventDefault();
            $event.stopPropagation();
            downloadTrack(track)
          "
        >
          <i class="bi bi-download"></i>
        </button>

        <button
          class="icon-button"
          title="Share"
          (click)="
            $event.preventDefault(); $event.stopPropagation(); shareTrack(track)
          "
        >
          <i class="bi bi-share"></i>
        </button>
      </div>
    </div>
  </div>
</div>
